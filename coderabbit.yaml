language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/generated/**"
    - "!**/*.generated.java"
    - "!**/build/**"
    - "!**/.gradle/**"

  path_instructions:
    - path: "**/*.java"
      instructions: |
        Java 21 + Spring Boot 3.x 기반 Eureka Server 코드를 검토해주세요.

        [Spring / Java]
        - Spring Boot 3.x 방식에 맞는지 확인해주세요
        - javax 대신 jakarta 네임스페이스를 올바르게 사용하는지 확인해주세요
        - 불필요한 Bean 또는 설정이 추가되어 있지 않은지 확인해주세요

        [Eureka]
        - Eureka Server 설정이 의도에 맞게 구성되어 있는지 확인해주세요
        - 단일 Eureka Server 구성에서 불필요한 Client 등록 설정이 있는지 확인해주세요
        - 서비스 디스커버리 관련 설정이 과도하거나 잘못되어 있으면 지적해주세요

        [구성 / 운영]
        - 민감정보가 코드나 설정에 하드코딩되어 있으면 지적해주세요
        - 환경별 설정 분리가 필요한 부분이 있는지 확인해주세요
        - Spring Boot / Spring Cloud 버전 호환성에 문제가 있을 가능성이 있으면 지적해주세요
        - 불필요한 복잡성이나 과도한 설정이 있으면 지적해주세요

chat:
  auto_reply: true